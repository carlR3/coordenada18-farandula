name: Ronda de farándula

on:
  schedule:
    # 3 rondas al día, hora de RD: 9:17 a. m., 2:23 p. m. y 8:41 p. m. (13:17, 18:23 y 00:41 UTC).
    # GitHub a veces atrasa las rondas programadas unos minutos.
    - cron: "17 13 * * *"
    - cron: "23 18 * * *"
    - cron: "41 0 * * *"
  workflow_dispatch:
    inputs:
      cantidad:
        description: "Cuántos carruseles preparar en esta ronda"
        default: "1"

permissions:
  contents: write

concurrency:
  group: ronda-farandula
  cancel-in-progress: false

jobs:
  ronda:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar
        run: |
          command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
          pip install -r requirements.txt

      - name: Preparar y publicar el carrusel
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          META_PAGE_ID: ${{ vars.META_PAGE_ID }}
          META_IG_ID: ${{ vars.META_IG_ID }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          VOZ: ${{ vars.VOZ }}
          CANTIDAD: ${{ inputs.cantidad || '1' }}
        run: python bot_farandula.py

      - name: Guardar historial (para no repetir historias)
        if: always()
        run: |
          mkdir -p estado
          git config user.name "farandula-bot"
          git config user.email "farandula-bot@users.noreply.github.com"
          git add estado/
          git diff --cached --quiet || (git commit -m "Historial de la ronda" && git push)
